<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="56" height="56" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Subtle Inner Glow -->
  <circle cx="20" cy="16" r="16" fill="white" opacity="0.12"/>

  <!-- Iconic Monogram "T" with Upward Progress Trajectory -->
  <!-- Top Horizontal Bar -->
  <rect x="14" y="17" width="36" height="8.5" rx="4.25" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Vertical Stem -->
  <rect x="27" y="24" width="10" height="23" rx="5" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Career Ascent Indicator (Cyan Target Arrow / Spark) -->
  <path d="M43 32 L49 26 M49 26 L44 26 M49 26 L49 31" 
        stroke="url(#accentGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <circle cx="49" cy="26" r="2.5" fill="#38bdf8"/>
</svg>
